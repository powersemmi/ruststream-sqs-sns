[workspace]
resolver = "3"
members = ["crates/ruststream-sqs-sns", "crates/ruststream-sqs-sns-bench"]

[workspace.package]
version = "0.7.2"
edition = "2024"
# The floor is the core's 1.95; the AWS SDK tracks a stable-2 MSRV policy (1.94.1 today). A
# dependent may exceed its dependencies' floors, so this is the higher of the two.
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/powersemmi/ruststream-sqs-sns"
homepage = "https://powersemmi.github.io/ruststream-sqs-sns/latest/"
authors = ["RustStream contributors"]

[workspace.dependencies]
ruststream-sqs-sns = { path = "crates/ruststream-sqs-sns" }

ruststream = { version = "0.7", default-features = false }

aws-config = "1.10"
# default-features off drops the legacy hyper-0.14/rustls-0.21 feature (RustSec advisories in
# rustls-webpki 0.101); the modern hyper-1/rustls-0.23 stack comes from default-https-client.
aws-sdk-sqs = { version = "1.105", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sns = { version = "1.107", default-features = false, features = ["default-https-client", "rt-tokio"] }
base64 = "0.23"
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `runtime::Id` (which runtime a request is sent from) is stable from 1.49.
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"
missing_docs = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_const_for_fn = "allow"
multiple_crate_versions = "allow"
redundant_pub_crate = "allow"

# What ships is optimized across crate boundaries: the framework is generic to the point where a
# dispatch path is only as cheap as the inlining it gets, and a build that stops at each crate
# boundary is not the one to publish numbers from.
[profile.release]
lto = "fat"

# The benchmarks measure what ships, so they are built the way a release is: the profile inherits
# it whole, and the only addition is the line tables a profile needs to name functions. Debug
# information is metadata and changes no codegen decision.
[profile.bench]
inherits = "release"
debug = "line-tables-only"
