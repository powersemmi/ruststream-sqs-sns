name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor, what users build with, and the early warning. Releases in between add
        # nothing: what fails on a later one fails on the floor too. Keep the floor in step
        # with `rust-version` in the workspace manifest.
        toolchain: [stable, beta, "1.94.1"]
    # Installing a toolchain does not select it: `rust-toolchain.toml` outranks the rustup
    # default the install action sets. RUSTUP_TOOLCHAIN outranks the file.
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      # Advisory, not a gate: surfaces a lint added by the next clippy release six weeks
      # before it turns the build red.
      - name: cargo clippy (beta, advisory)
        if: matrix.toolchain == 'beta'
        continue-on-error: true
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: cargo check (no default features)
        run: cargo check --locked --workspace --no-default-features

      - name: cargo check (all features)
        run: cargo check --locked --workspace --all-targets --all-features

      # --no-fail-fast: a failing target must not hide failures in the targets behind it;
      # the log then lists every red test, not just the first binary's.
      - name: cargo test (handler-stub only, no live broker)
        run: cargo test --locked --workspace --all-features --no-fail-fast

      # The crate-root missing_docs deny covers item docs; this gate catches what rustc
      # cannot: broken intra-doc links and redundant targets only rustdoc resolves.
      - name: cargo doc
        if: matrix.toolchain == 'stable'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

  features:
    name: Each feature alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2.86.5
        with:
          tool: cargo-hack

      # --no-dev-deps: a dev-dependency in scope masks a missing feature gate in the library.
      # Here that is `ruststream` with conformance, testing, macros and json on, which would
      # hide a `testing`-gated item reached from the default build. No --locked: cargo-hack
      # edits the real manifest to drop those dev-dependencies, and the resolve that follows
      # no longer matches the committed lockfile.
      - name: cargo hack check (each feature)
        run: cargo hack check --workspace --each-feature --no-dev-deps

  minimal-versions:
    name: Minimal versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install nightly (resolver only)
        uses: dtolnay/rust-toolchain@nightly

      # The floor, for the build step below. Keep the version in step with `rust-version` in
      # the workspace manifest.
      - name: Install the MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The full flag rather than -Z direct-minimal-versions: the narrow one leaves the
      # assembled graph unverified, and that is what a user builds. It costs a pinning list
      # whenever a third-party manifest declares a bound looser than what it actually needs;
      # add `cargo update -p <crate> --precise <version>` steps below when that happens, each
      # with the reason and the condition for dropping it. The AWS SDK graph needs none today.
      - name: Resolve minimal versions
        run: cargo +nightly update -Z minimal-versions

      # Minimum dependencies on the minimum compiler: the worst case a user can assemble.
      # Resolution above needs nightly, so only this step drops to the floor.
      - name: Build and test against minimal versions
        env:
          RUSTUP_TOOLCHAIN: "1.94.1"
        run: |
          cargo check --locked --workspace --all-targets --all-features
          cargo test --locked --workspace --all-features --no-fail-fast

  broker-integration:
    name: Broker integration (LocalStack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Pinned to the last token-free LocalStack tag; newer images require an auth token,
      # which fork PRs cannot read from secrets.
      - name: Start LocalStack
        run: |
          docker run -d --name localstack \
            -p 127.0.0.1:4566:4566 \
            -e SERVICES=sqs,sns \
            -e EAGER_SERVICE_LOADING=1 \
            -e SQS_ENDPOINT_STRATEGY=path \
            localstack/localstack:4.14.0

      - name: Wait for LocalStack
        timeout-minutes: 3
        run: |
          timeout 150 bash -c 'until curl -fsS http://127.0.0.1:4566/_localstack/health | grep -q "\"sqs\": \"running\""; do sleep 2; done'
          curl -fsS http://127.0.0.1:4566/_localstack/health

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run integration + conformance against LocalStack
        env:
          SQS_TEST_ENDPOINT: http://127.0.0.1:4566
        run: >-
          cargo test --locked -p ruststream-sqs-sns --all-features
          --test integration_sqs
          --test conformance_sqs
          -- --test-threads=1

      - name: Cleanup
        if: always()
        run: docker rm -f localstack

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.86.5
        with:
          tool: cargo-deny

      # Dependency-graph gate: RustSec advisories, license allow-list, duplicate
      # versions, and registry sources, per the checked-in deny.toml. Not path-
      # gated: advisories arrive over time, not only with manifest changes.
      - name: cargo deny
        run: cargo deny check

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: codespell
        run: uvx codespell

      - name: zizmor
        run: uvx zizmor .github/workflows
