# Locked renderings for the documentation's terms of art.
#
# A machine translation of technical prose does not fail by producing unreadable text; it
# fails by rendering a term of art with a dictionary synonym, so that two pages of the same
# site name the same concept differently and the reader cannot tell whether a distinction is
# meant. Each term below therefore has exactly one rendering per language, and
# `scripts/check_doc_i18n.py` enforces it: where the English page uses a listed term, the
# translated page has to use the locked equivalent.
#
# Fields:
#   en        the English term, matched case-insensitively on word boundaries
#   en_match  optional regex replacing that default match (for irregular plurals or spellings)
#   ru, zh    the locked rendering, and what a translator must write
#   ru_match  optional regex accepting inflected forms of the Russian rendering
#   zh_match  optional regex, same purpose, rarely needed
#
# A term kept in Latin script in a target language is a deliberate choice, not an oversight:
# `ack`, `trait` and `crate` are what Russian and Chinese Rust texts actually write, and
# replacing them with a translated coinage would make the page harder to read, not easier.
#
# Adding a term here is cheap and retroactive: the check reports every existing translated
# page that does not yet honour it, so add terms only once their rendering is settled.

[[term]]
en = "ack"
ru = "ack"
zh = "ack"

[[term]]
en = "nack"
ru = "nack"
zh = "nack"

[[term]]
en = "broker"
en_match = "brokers?"
ru = "брокер"
ru_match = "брокер"
zh = "Broker"
zh_match = "(?i)broker"

[[term]]
en = "subscriber"
en_match = "subscribers?"
ru = "подписчик"
ru_match = "подписчик"
zh = "订阅者"

[[term]]
en = "publisher"
en_match = "publishers?"
ru = "издатель"
ru_match = "издател"
zh = "发布者"

[[term]]
en = "capability"
en_match = "capabilit(y|ies)"
ru = "совместимость"
ru_match = "совместимост"
zh = "能力"

[[term]]
en = "batch"
en_match = "batch(es|ed|ing)?"
ru = "пакет"
ru_match = "пакет"
zh = "批"

[[term]]
en = "subscription"
en_match = "subscriptions?"
ru = "подписка"
ru_match = "подписк"
zh = "订阅"

[[term]]
en = "handler"
en_match = "handlers?"
ru = "обработчик"
ru_match = "обработчик"
zh = "处理器"

[[term]]
en = "message"
en_match = "messages?"
ru = "сообщение"
ru_match = "сообщени"
zh = "消息"

[[term]]
en = "middleware"
ru = "middleware"
zh = "中间件"

[[term]]
en = "router"
en_match = "routers?"
ru = "роутер"
ru_match = "роутер"
zh = "路由器"

[[term]]
en = "codec"
en_match = "codecs?"
ru = "кодек"
ru_match = "кодек"
zh = "编解码器"

[[term]]
en = "back-pressure"
en_match = "back[- ]?pressure"
ru = "обратное давление"
ru_match = "обратн\\w* давлени"
zh = "背压"

[[term]]
en = "at-least-once"
ru = "at-least-once"
zh = "至少一次"

[[term]]
en = "at-most-once"
ru = "at-most-once"
zh = "至多一次"

[[term]]
en = "cancel safety"
en_match = "cancel[- ]safe(ty)?"
ru = "безопасность при отмене"
ru_match = "безопасн\\w* при отмене"
zh = "取消安全"

[[term]]
en = "compile time"
en_match = "compile[- ]time"
ru = "время компиляции"
ru_match = "компиляци"
zh = "编译期"
zh_match = "编译(期|时)"

[[term]]
en = "zero-cost"
ru = "zero-cost"
zh = "零成本"

[[term]]
en = "trait"
en_match = "traits?"
ru = "трейт"
ru_match = "трейт"
zh = "trait"

[[term]]
en = "crate"
en_match = "crates?"
ru = "крейт"
ru_match = "крейт"
zh = "crate"

[[term]]
en = "typestate"
ru = "typestate"
zh = "typestate"

# The terms below belong to SQS and SNS rather than to the framework, so their rendering is
# AWS's own rather than the core's: a reader who arrives from the SQS documentation has to meet
# the same word here. AWS publishes its SQS guide in Chinese, which settles that column
# outright. It no longer publishes it in Russian, so the Russian column takes the wording of
# AWS's remaining Russian pages, and of Yandex Message Queue where AWS says nothing - an
# SQS-compatible service whose Russian documentation is the one a Russian-speaking SQS user
# actually reads.
#
# Where a broker term meets a framework one on the same page, the broker keeps its word: the
# FIFO message group is «группа сообщений» / 消息组 even though the framework surfaces it as a
# partition key, which stays the literal `partition-key` header everywhere.
#
# Every multi-word pattern below matches across whitespace rather than on a literal space: the
# pages are hard-wrapped, so a term of two words lands on two lines often enough that a pattern
# requiring a space would report a page that says exactly the right thing.

[[term]]
en = "queue"
en_match = "queues?"
ru = "очередь"
ru_match = "очеред"
zh = "队列"

[[term]]
en = "standard queue"
en_match = "standard\\s+queues?"
ru = "стандартная очередь"
ru_match = "стандартн\\w*\\s+очеред"
zh = "标准队列"

[[term]]
en = "topic"
en_match = "topics?"
ru = "тема"
ru_match = "\\bтем[аыуеой]"
zh = "主题"

[[term]]
en = "FIFO"
ru = "FIFO"
zh = "FIFO"

[[term]]
en = "message group"
en_match = "message\\s+groups?"
ru = "группа сообщений"
ru_match = "групп\\w*\\s+сообщений"
zh = "消息组"

[[term]]
en = "deduplication"
en_match = "deduplicat\\w*"
ru = "дедупликация"
ru_match = "дедупликаци"
zh = "重复数据删除"

[[term]]
en = "visibility timeout"
en_match = "visibility\\s+timeouts?"
ru = "тайм-аут видимости"
ru_match = "тайм-аут\\w*\\s+видимости"
zh = "可见性超时"

[[term]]
en = "long polling"
en_match = "long[-\\s]poll\\w*"
ru = "длинный опрос"
ru_match = "длинн\\w*\\s+опрос"
zh = "长轮询"

[[term]]
en = "dead-letter queue"
en_match = "dead[-\\s]letter\\w*"
ru = "очередь недоставленных сообщений"
ru_match = "очеред\\w*\\s+недоставленных\\s+сообщений"
zh = "死信队列"

[[term]]
en = "redrive policy"
en_match = "redrive\\s+polic(y|ies)"
ru = "политика перенаправления"
ru_match = "политик\\w*\\s+перенаправления"
zh = "重新驱动策略"

[[term]]
en = "message attribute"
en_match = "message\\s+attributes?"
ru = "атрибут сообщения"
ru_match = "атрибут\\w*\\s+сообщени"
zh = "消息属性"

[[term]]
en = "fan-out"
en_match = "fan[-\\s]?out"
ru = "доставка всем подписчикам разом"
ru_match = "всем\\s+подписчикам\\s+разом"
zh = "扇出"
