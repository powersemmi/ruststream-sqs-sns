[package]
name = "ruststream-sqs-sns"
description = "Amazon SQS broker implementation for the RustStream messaging framework, with optional SNS fan-out publishing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["aws", "sqs", "sns", "broker", "ruststream"]
categories = ["asynchronous", "network-programming"]

# The overview links the modules the optional features gate, so the published page has to
# be built with all of them.
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[features]
default = []
# The broker's in-process mode: `TestApp::start` connects `SqsBroker` without a server. A service
# enables it in its dev-dependencies. The conformance harness is a broker-author tool and stays in
# this repo's dev-dependencies, not in the user-facing feature.
testing = ["ruststream/testing"]
# What this broker contributes to the AsyncAPI document the framework generates: the `sqs`
# protocol bindings of the channels a subscription reads and a publish position writes, and the
# `sns` ones of a fan-out position when `sns` is on too.
asyncapi = ["ruststream/asyncapi", "dep:serde"]
# Publishing to SNS topics: `SnsPublish` / `SnsPublisher` and subscribing a queue to a topic.
# Off by default, so a service that only reads and writes queues builds without the SNS client.
sns = ["dep:aws-sdk-sns"]

[dependencies]
ruststream = { workspace = true, default-features = false }
aws-config.workspace = true
aws-sdk-sqs.workspace = true
aws-sdk-sns = { workspace = true, optional = true }
base64.workspace = true
bytes.workspace = true
futures.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
ruststream = { workspace = true, features = ["asyncapi", "conformance", "testing", "macros", "json"] }
serde.workspace = true
serde_json = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[[example]]
name = "sns_fanout"
required-features = ["sns"]

