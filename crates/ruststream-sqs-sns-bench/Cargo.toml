[package]
name = "ruststream-sqs-sns-bench"
description = "The benchmarks of ruststream-sqs-sns: the paired raw-versus-framework comparison and the code-cost scenarios. Never published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# A benchmark measures what ships, and the framework's harness feature changes the dispatch path:
# every delivery records what the handler saw and every handler call runs inside a task-local
# scope. Nothing here enables this; it exists so that asking for it is a compile error in every
# benchmark here rather than a number nobody can trust.
testing = ["ruststream-sqs-sns/testing"]

# The benchmarks live in their own package so that every measured binary links the framework the
# way a service does. `ruststream-sqs-sns`'s own dev-dependencies pull `ruststream/conformance`,
# which enables `ruststream/testing`, and a benchmark inside that package would be built against it.
[dev-dependencies]
ruststream-sqs-sns.workspace = true
# The code-cost scenarios (`consume`, `reply`, `batch`): callgrind and DHAT through the runner the
# core pins.
gungraun = "=0.19.4"
# The framework loop is the service a user writes, so it needs the handler macros and a codec;
# the adapter and raw loops decode in their own frame and use neither.
ruststream = { workspace = true, features = ["macros", "json"] }
aws-config.workspace = true
aws-sdk-sqs.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[[bench]]
name = "paired"
harness = false

# The code-cost scenarios: one per binary, each a service on the production broker against the
# stand. `just bench-code` runs them under valgrind; `benches/common` is the shared setup.
[[bench]]
name = "consume"
harness = false

[[bench]]
name = "reply"
harness = false

[[bench]]
name = "batch"
harness = false
